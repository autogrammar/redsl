name: wellman

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Check out dependency-free Wellman source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: wellmanifest/wellman
          ref: 73b4edcf3e74709734c755a4f68cbf328b7d6f5b
          path: .wellman-runtime
          persist-credentials: false
      - name: Verify the Wellman source revision
        run: test "$(git -C .wellman-runtime rev-parse HEAD)" = '73b4edcf3e74709734c755a4f68cbf328b7d6f5b'
      - name: Validate adopted requirements and Docs metadata
        env:
          PYTHONPATH: ${{ github.workspace }}/.wellman-runtime/src
        run: python -S scripts/check-wellman.py
