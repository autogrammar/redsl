version: "3.9"

services:
  agent:
    build: .
    ports:
      - "8020:8000"
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      REFACTOR_LLM_MODEL: ${REFACTOR_LLM_MODEL:-gpt-5.4-mini}
      REFACTOR_DRY_RUN: ${REFACTOR_DRY_RUN:-true}
      REFACTOR_AUTO_APPROVE: "false"
    volumes:
      - ./redsl_output:/app/redsl_output
      - redsl_memory:/tmp/redsl_memory
      - ${PROJECT_PATH:-.}:/mnt/project:ro
    depends_on:
      - chroma
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:latest@sha256:ec27cd5af06c0561bd485ca3848ebf58c29c01e0beffcd69cd8db95d1ea356a4
    ports:
      - "8005:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

  # Tryb "consciousness loop" — agent pracuje autonomicznie
  consciousness:
    build: .
    command: ["python", "-m", "redsl.consciousness_loop", "--project", "/mnt/project", "--interval", "120"]
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      REFACTOR_LLM_MODEL: ${REFACTOR_LLM_MODEL:-gpt-5.4-mini}
      REFACTOR_DRY_RUN: "true"
    volumes:
      - ./redsl_output:/app/redsl_output
      - redsl_memory:/tmp/redsl_memory
      - ${PROJECT_PATH:-.}:/mnt/project:ro
    depends_on:
      - chroma
    profiles:
      - autonomous  # uruchamiany tylko z: docker-compose --profile autonomous up
    restart: unless-stopped

volumes:
  chroma_data:
  redsl_memory:
